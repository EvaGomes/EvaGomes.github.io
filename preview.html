	<style>
		:root {
			--colors-bg: #eee;
			--box-width: 300px;
		}
		* {
			font-family: sans-serif;
			box-sizing: border-box;
		}
		div#diapers {
		    display: flex;
			justify-content: center;
			gap: 1rem;
			flex-wrap: wrap;
			margin: 1rem;
		}
		.diaper {
			background: var(--colors-bg);
			border: 6px solid var(--colors-bg);
			border-radius: 5px;
			margin: 0;
			
			max-width: var(--box-width);
			width: var(--box-width);
			min-width: var(--box-width);
			
			display: flex;
			flex-direction: column;
		}
		.diaper img {
			border-radius: 5px;
			width: 100%;
			max-width: 100%;
		}
		.diaper .brand {
			color: inherit;
			font-size: small;
			text-decoration: none;
		}
		.diaper .pattern {
			font-weight: 900;
			margin: 1rem;
			text-align: center;
		}
		.diaper .sponsor {
		    display: none;
		}
		.diaper .number {
			background: lightpink;
			border-radius: 50%;			
			width: 24px;
			height: 24px;
			
			padding-top: 3px;
			text-align: center;
			
			position: absolute;
			top: 3px;
			right: 3px;
		}
		.diaper .country {
			border-radius: 50%;			
			width: 24px;
			height: 24px;
			
			position: absolute;
			top: 30px;
			right: 3px;
		}
		
		.diaper.sponsored .brand {
			color: darkgray;
		}
		.diaper.sponsored .pattern {
			color: darkgray;
			font-weight: 600;
		}
		.diaper.sponsored .sponsor {
			display: block;
			font-weight: 900;
			text-align: center;
		}
		.diaper.sponsored .number {
			background: #ddd;
			color: darkgray;
		}
	</style>

		function renderDiaper(d,index,showSponsored) {
			//return `<pre class="diaper">${JSON.stringify(d, null, 2)}</pre>`
			if (!showSponsored && d.sponsor) return '';
			const isPT = d.marca==="Pico Tango" || d.marca==="Piriuki";
			return `
				<div class="diaper${d.sponsor ? ' sponsored' : ''}" style="position:relative">
					<div class="brand"><b>${d.marca}</b> ${d.modelo}</div>
					<h3 class="pattern">${d.padrao}</h3>
					<h3 class="sponsor">🎁 Fralda ${d.sponsor}</h3>
					${d.imgs.map(i => `<img src="${i}" />`).join('')}
					<div class="number">${index+1}</div>
					${isPT ? `<div class="country"><img src="https://em-content.zobj.net/source/joypixels/275/flag-portugal_1f1f5-1f1f9.png"></div>` : '' }
				</div>`;
		}
		function renderDiapers(div, showSponsored) {
			console.debug('rendering', showSponsored)
			div.innerHTML = DATA.map((d,i) => renderDiaper(d,i,showSponsored)).join('');
		}
		
		const div = document.getElementById('diapers');
		const checkbox = document.getElementById('apadrinhadas');
		const checkboxLabel = document.querySelector('label[for="apadrinhadas"]');
		
		checkboxLabel.innerHTML = 'Esconder apadrinhadas';
		renderDiapers(div,!checkbox.checked);
		
		checkbox.addEventListener('change', evt => renderDiapers(div,!evt.target.checked));
		
		console.debug({
			DATA,
			sponsoredCount: DATA.filter(d => d.sponsor).length,
			sponsoredURLs: DATA.map(d => d.sponsor ? d.url : null) })
	</script>
