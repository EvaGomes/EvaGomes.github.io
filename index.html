<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revelação do Bebé 💖💙</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Pacifico', cursive;
    background: linear-gradient(to bottom, #fff0f5, #e0f7fa); /* Rosa + azul */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
    text-align: center;
    transition: background 1s ease;
  }
  h1 {
    font-size: 3rem;
    margin-bottom: 20px;
    color: #d63384;
  }
  #countdown {
    font-size: 2rem;
    color: #ff4da6;
    margin-bottom: 20px;
  }
  .reveal {
    display: none;
    font-size: 4rem;
    margin-top: 20px;
    color: #ff3399;
    animation: fadein 1s ease-in-out forwards;
  }
  @keyframes fadein {
    from {opacity: 0;}
    to {opacity: 1;}
  }
  audio {
    display: none;
  }
</style>
</head>
<body>

<h1>Adivinhem o que vem aí… 🎀💖💙</h1>
<div id="countdown"></div>
<div class="reveal" id="revealText">💖💖 É UMA MENINA!!! 💖💖</div>

<!-- Música feliz (loop) -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2024/08/19/audio_3f958dc319.mp3?filename=happy-whistle-tunes-233525.mp3" type="audio/mpeg">
  O seu navegador não suporta áudio.
</audio>

<!-- Biblioteca confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
/* ==== Configuração da DATA/HORA da revelação ==== */
// 15 de agosto às 20:30 (hora de Lisboa)
let revealDate = new Date('2025-08-15T20:30:00+01:00');

let countdownEl = document.getElementById("countdown");
let revealText = document.getElementById("revealText");
let bgMusic = document.getElementById("bgMusic");
let bodyEl = document.body;

/* ==== Contagem decrescente ==== */
let timer = setInterval(function() {
  let now = new Date().getTime();
  let distance = revealDate.getTime() - now;

  if (distance <= 0) {
    clearInterval(timer);
    iniciarRevelacao();
  } else {
    let hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    let minutes = Math.floor((distance / (1000 * 60)) % 60);
    let seconds = Math.floor((distance / 1000) % 60);
    countdownEl.innerHTML = `Faltam ${hours}h ${minutes}m ${seconds}s`;
  }
}, 1000);

/* ==== Função de revelação ==== */
function iniciarRevelacao() {
  countdownEl.style.display = "none";
  revealText.style.display = "block";
  bgMusic.play();
  bodyEl.style.background = "linear-gradient(to bottom, #fff0f5, #ffe6f0)"; // Fica só rosa
  soltarConfetis();
}
