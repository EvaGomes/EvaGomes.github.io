<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>❤ Gender-Reveal ❤</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Oooh+Baby&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand+SC&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --colors-blue: #b0f6ff;
        --colors-purple: #911a8c;
        --colors-pink: #ffb6cf;
      }
      * {
        margin: 0;
        padding: 0;
      }

      body {
        background: linear-gradient(30deg, var(--colors-pink), var(--colors-purple), var(--colors-blue));
        color: white;
        font-family: cursive;
        text-align: center;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 3em;
        height: 100vh;
      }
      body.revealed {
        background: linear-gradient(to bottom, #fff0f5, #ffe6f0);
        transition: background 5s ease;
      }

      #intro {
        background: rgba(255,255,255,0.5);
        font-family: "Patrick Hand SC", cursive;
        font-size: 3rem;
        padding: 1rem;
        text-align: center;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1em;
      }
      #intro.hidden {
        display: none;
      }
      #intro img {
        max-height: 40vh;
        max-width: 80vw;
      }

      #countdown {
        color: black;
        font-family: "Pacifico", cursive;
        font-size: 2rem;
      }
      #countdown.big-number {
        font-family: "Patrick Hand SC", cursive;
        font-size: 50vh;
        position: relative;
        top: -0.2em;
      }
      #countdown.revealed {
        display: none;
      }

      #revealText {
        display: none;
        color: #ff4da6;
        font-family: "Pacifico", cursive;
        font-size: 10vw;
        animation: fadein 1s ease-in-out forwards;
      }
      #revealText img {
        max-height: 1em;
      }
      #revealText.revealed {
        display: block;
      }

      @keyframes fadein {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="intro">
      <p>Que bichinho é este?</p>
      <img src="https://github.com/EvaGomes/EvaGomes.github.io/blob/site/eco.jpg?raw=true" />
      <p>❤❤❤ UM EVÁRIO?<br />UMA MÁRIEVA? ❤❤❤</p>
    </div>
    <div id="countdown"></div>
    <div id="revealText"></div>

    <audio id="bgMusic" loop style="display: none">
      <source
        src="https://cdn.pixabay.com/download/audio/2024/08/19/audio_3f958dc319.mp3?filename=happy-whistle-tunes-233525.mp3"
        type="audio/mp3"
      />
    </audio>

    <audio id="countdownBeep" style="display: none">
      <source
        src="https://cdn.pixabay.com/download/audio/2025/07/10/audio_20c3b0b569.mp3?filename=countdown-372679.mp3"
        type="audio/mp3"
      />
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
      const REVEAL_DATE = new Date('2025-08-30T18:15:00+01:00');
      const FINAL_COUNTDOWN_DURATION_SECS = 90;
      const CONFETTIS_DURATION_SECS = 8;

      const introEl = document.getElementById("intro");
      const countdownEl = document.getElementById("countdown");
      const revealText = document.getElementById("revealText");
      const countdownSound = document.getElementById("countdownBeep");
      const revealMusic = document.getElementById("bgMusic");
      const bodyEl = document.body;

      let secondsLeftTotal = Math.floor((REVEAL_DATE.getTime() - new Date().getTime()) / 1000);
      if (secondsLeftTotal < 0) {
        secondsLeftTotal = FINAL_COUNTDOWN_DURATION_SECS + 5;
      }

      const timer = setInterval(() => {
        if (secondsLeftTotal > FINAL_COUNTDOWN_DURATION_SECS) {
          updateCountdown();
          secondsLeftTotal -= 1;
        } else if (secondsLeftTotal > 0) {
          if (secondsLeftTotal === FINAL_COUNTDOWN_DURATION_SECS)
            setupFinalCountdown();
          if (secondsLeftTotal % 31 === 0) restartCountdownMusic();
          updateFinalCountdown();
          secondsLeftTotal -= 1;
        } else {
          clearInterval(timer);
          startReveal();
        }
      }, 1000);

      function updateCountdown() {
        let hours = Math.floor((secondsLeftTotal / 3600) % 24);
        let minutes = Math.floor((secondsLeftTotal / 60) % 60);
        let seconds = secondsLeftTotal % 60;
        countdownEl.innerHTML = `${hours}h ${minutes}m ${seconds}s`;
      }
      function setupFinalCountdown() {
        introEl.className = "hidden";
        countdownEl.className = "big-number";
        countdownSound.play();
      }
      function restartCountdownMusic() {
        countdownSound.currentTime = 0;
      }
      function updateFinalCountdown() {
        countdownEl.style.color = `var(--colors-${secondsLeftTotal % 2 === 0 ? "blue" : "pink"})`;
        countdownEl.innerHTML = secondsLeftTotal;
      }

      function startReveal() {
        document.body.className = "revealed";
        introEl.className = "hidden";
        countdownEl.className = "revealed";
        revealText.className = "revealed";
        revealText.innerHTML = String.fromCharCode(117, 109, 97, 32, 77, 225, 114, 105, 69, 118, 97)
            + '!!!<br /><img src="https://em-content.zobj.net/source/microsoft/74/ribbon_1f380.png" />'

        countdownSound.pause();
        revealMusic.play();
        launchConfettis();
      }

      function launchConfettis() {
        const end = Date.now() + CONFETTIS_DURATION_SECS * 1000;
        (function frame() {
          const confettiCommonSettings = {
            particleCount: 6,
            spread: 65,
            colors: ["#ff69b4", "#ffb6c1", "#ffc0cb", "#ffb6cf"],
          };
          confetti({ ...confettiCommonSettings, angle: 60, origin: { x: 0 } });
          confetti({ ...confettiCommonSettings, angle: 120, origin: { x: 1 } });
          if (Date.now() < end) {
            requestAnimationFrame(frame);
          }
        })();
      }
    </script>
  </body>
</html>
