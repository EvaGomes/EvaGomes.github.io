	<style>
		:root {
			--colors-bg: #eee;
			--box-width: 300px;
		}
		* {
			font-family: sans-serif;
			box-sizing: border-box;
		}
		div#diapers {
		    display: flex;
			align-items: center;
			justify-content: center;
			gap: 1rem;
			flex-wrap: wrap;
			margin: 1rem;
		}
		.diaper {
			background: var(--colors-bg);
			border: 3px solid var(--colors-bg);
			border-radius: 5px;
			margin: 0;
			
			max-width: var(--box-width);
			width: var(--box-width);
			min-width: var(--box-width);
			
			display: flex;
			flex-direction: column;
		}
		.diaper img {
			border-radius: 5px;
			width: 100%;
			max-width: 100%;
		}
		.diaper .brand {
			color: inherit;
			font-size: small;
			text-decoration: none;
		}
		.diaper .pattern {
			font-weight: 900;
			margin: 1rem;
			text-align: center;
		}
		.diaper .sponsor {
		    display: none;
		}
		.diaper .number {
			background: lightpink;
			border-radius: 50%;			
			width: 24px;
			height: 24px;
			
			padding-top: 3px;
			text-align: center;
			
			position: absolute;
			top: 3px;
			right: 3px;
		}
		.diaper .country {
			border-radius: 50%;			
			width: 24px;
			height: 24px;
			
			position: absolute;
			top: 30px;
			right: 3px;
		}
		
		.diaper.sponsored .brand {
			color: darkgray;
		}
		.diaper.sponsored .pattern {
			color: darkgray;
			font-weight: 600;
		}
		.diaper.sponsored .sponsor {
			display: block;
			font-weight: 900;
			text-align: center;
		}
		.diaper.sponsored .number {
			background: var(--colors-bg);
		}
	</style>
</head>
